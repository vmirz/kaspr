name: Build and Push Docker Image

# A tag v<version> publishes the image under <version> to Docker Hub (kasprio/kaspr) and to GHCR
# (ghcr.io/<repository owner>/kaspr). One build for both platforms is pushed under both names, so
# the two registries serve the same image.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # GHCR takes the workflow's GITHUB_TOKEN: no credential is stored for it
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            kasprio/kaspr
            ghcr.io/${{ github.repository_owner }}/kaspr
          # The tag without its v, whatever follows it (v0.11.34 -> 0.11.34, v0.10.6dev -> 0.10.6dev),
          # and no latest.
          tags: type=match,pattern=^v(.*)$,group=1
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Their org.opencontainers.image.source links the GHCR package to this repository, whose
          # access it then inherits.
          labels: ${{ steps.meta.outputs.labels }}
